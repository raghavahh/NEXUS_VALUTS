name: AI Video Factory Manual Run

# Deliberately manual-only. Start this workflow from the GitHub Actions tab.
on:
  workflow_dispatch:
    inputs:
      force_topic:
        description: "Optional forced topic name (e.g. 'Mary Celeste')"
        type: string
        default: ""
        required: false
      dry_run:
        description: "Full render + QC, no DB commits, no upload"
        type: boolean
        default: false
        required: false
      skip_qc:
        description: "Skip 3-layer visual QC (faster, DANGEROUS)"
        type: boolean
        default: false
        required: false

# Only one production run at a time; never cancel a run that is mid-upload.
concurrency:
  group: aivf-production
  cancel-in-progress: false

permissions:
  contents: write   # needed to save state to the factory-state branch
  actions: read     # needed for workflow run metadata

jobs:
  run:
    # Windows runner on purpose: the renderer uses Windows fonts (C:/WINDOWS/fonts/...).
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    env:
      # ---- Secrets (injected from GitHub Repository Secrets) ----
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # ---- Non-Secret Application Configuration ----
      APP_MODE: production
      SCHEDULE_TIMEZONE: America/New_York
      SCHEDULE_TZ: America/New_York
      CHANNEL_NAME: NEXUS VAULTS
      CHANNEL_HANDLE: NEXUS_VAULTS
      CHANNEL_NICHE: ${{ vars.CHANNEL_NICHE || 'history' }}
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

      # ---- AI Routing & Explicit Stable Model Architecture ----
      AI_TEXT_PROVIDER_CHAIN: nvidia,groq,gemini,openrouter
      NVIDIA_MODEL: nvidia/nemotron-3-super-120b-a12b
      GROQ_MODEL: qwen/qwen3.8-27b
      GEMINI_MODEL: gemini-3.5-flash
      OPENROUTER_MODEL: nvidia/nemotron-3-super-120b-a12b:free
      AI_REQUEST_TIMEOUT: 60
      AI_MAX_RETRIES: 2

      # ---- Quality Control Thresholds ----
      QC_FRAME_MATCH_THRESHOLD: "0.40"
      QC_REQUIRE_UNIQUE_ASSETS: "true"
      QC_REQUIRE_FRAME_VERIFICATION: "true"

      # ---- Review Mode vs Live Mode ----
      # In review mode (AI_VIDEO_FACTORY_LIVE not "true"), preserve rendered media artifacts.
      TEST_KEEP_ARTIFACTS: ${{ vars.AI_VIDEO_FACTORY_LIVE == 'true' && 'false' || 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout state branch
        id: state_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: factory-state
          path: state
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Chocolatey
        id: choco-cache
        uses: actions/cache@v4
        with:
          path: C:\ProgramData\chocolatey
          key: choco-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            choco-${{ runner.os }}-

      - name: Install dependencies & FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install yt-dlp tzdata
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            if ('${{ steps.choco-cache.outputs.cache-hit }}' -ne 'true') {
              Write-Host "Installing ffmpeg via chocolatey..."
              choco install ffmpeg -y --no-progress
            } else {
              Write-Host "Using cached Chocolatey/FFmpeg."
            }
          } else {
            Write-Host "ffmpeg is already pre-installed on this runner."
          }
          ffmpeg -version | Select-Object -First 1

      - name: Preflight Validation
        run: python tests/test_preflight.py

      - name: Hardcoding Audit
        run: python tests/test_audit.py

      - name: Restore state
        run: |
          New-Item -ItemType Directory -Force .factory_state | Out-Null
          if (Test-Path state/channel.db) {
            Copy-Item state/channel.db .factory_state/channel.db -Force
            Write-Host "State restored from factory-state branch."
          } elseif (Test-Path .factory_state/channel.db) {
            Write-Host "Using seeded state from repository."
          } else {
            Write-Warning "No existing channel.db found. Engine will initialize fresh database with Video #001 preservation."
          }
          if (Test-Path state/channel_brain.json) {
            Copy-Item state/channel_brain.json .factory_state/channel_brain.json -Force
            Write-Host "Channel Brain restored from factory-state branch."
          }

      - name: Run AI Video Factory
        env:
          FORCE_TOPIC: ${{ inputs.force_topic }}
        run: |
          $live = '${{ vars.AI_VIDEO_FACTORY_LIVE }}' -eq 'true'
          $dryRun = '${{ inputs.dry_run }}' -eq 'true'
          $skipQc = '${{ inputs.skip_qc }}' -eq 'true'
          $forcedTopic = $env:FORCE_TOPIC.Trim()
          $topicArgs = @()
          if ($forcedTopic) { $topicArgs += @("--force-topic", $forcedTopic) }
          if ($dryRun) { $topicArgs += "--dry-run" }
          if ($skipQc) { $topicArgs += "--skip-qc" }

          if ($live) {
            Write-Host "=========================================================="
            Write-Host "🚀 LIVE PRODUCTION RUN: Rendering and Publishing to YouTube"
            Write-Host "=========================================================="
            python main.py @topicArgs
          } else {
            Write-Host "=========================================================="
            Write-Host "🔍 REVIEW MODE: Rendering short, NO live YouTube upload"
            Write-Host "   Set repository variable AI_VIDEO_FACTORY_LIVE=true when ready"
            Write-Host "=========================================================="
            python main.py --skip-upload @topicArgs
          }

      # Review mode or failure: upload rendered video and intermediate assets
      - name: Upload rendered video artifact
        if: always() && vars.AI_VIDEO_FACTORY_LIVE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aivf-rendered-short
          path: |
            OUTPUT/*.mp4
            OUTPUT/storyboard/*.jpg
            .factory_state/temp/**/render_manifest.json
          if-no-files-found: ignore
          retention-days: 7

      # Always backup database state as an artifact for instant disaster recovery
      - name: Backup database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aivf-database-state
          path: |
            .factory_state/channel.db
            .factory_state/channel_brain.json
          if-no-files-found: ignore
          retention-days: 14

      # Live mode: persist state to the factory-state git branch
      - name: Save state to factory-state branch
        if: always() && vars.AI_VIDEO_FACTORY_LIVE == 'true'
        run: |
          if ((Test-Path .factory_state/channel.db) -or (Test-Path .factory_state/channel_brain.json)) {
            if (-not (Test-Path state/.git)) {
              New-Item -ItemType Directory -Force state | Out-Null
              Push-Location state
              git init
              git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
              git checkout -b factory-state
            } else {
              Push-Location state
            }
            if (Test-Path ../.factory_state/channel.db) {
              Copy-Item ../.factory_state/channel.db ./channel.db -Force
            }
            if (Test-Path ../.factory_state/channel_brain.json) {
              Copy-Item ../.factory_state/channel_brain.json ./channel_brain.json -Force
            }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add channel.db
            if (Test-Path channel_brain.json) {
              git add channel_brain.json
            }
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "state update: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"
              git push origin HEAD:factory-state
              Write-Host "State successfully saved and pushed to factory-state branch."
            } else {
              Write-Host "State unchanged; no commit needed."
            }
            Pop-Location
          } else {
            Write-Warning "No .factory_state/channel.db found; nothing to save."
          }
